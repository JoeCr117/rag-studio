line-length = 120
target-version = "py314"
extend-exclude = ["backend/studio/migrations"]

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT"]
ignore = [
    "N818",   # exception names read as domain terms (JobRefused, InvalidHostPath), not "...Error"
    "PT018",  # one assert per fact, sometimes joined with `and` for a single idea
]

[lint.per-file-ignores]
"backend/studio/models.py" = ["RUF012"]  # Django's Meta options are class-level lists by design

[lint.isort]
known-first-party = ["studio", "studio_site", "control_actions", "control_server", "folder_picker"]
